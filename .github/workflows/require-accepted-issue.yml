name: Require accepted issue
on:
  # https://docs.github.com/en/actions/reference/security/securely-using-pull_request_target
  pull_request_target:
    types: [opened, reopened, edited]

jobs:
  check:
    #if: >-
    #  !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
    #  github.event.pull_request.author_association)
    #  && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
    steps:
      - name: Check linked issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BODY: >-
            Thanks for your interest in contributing! This project only accepts
            pull requests from external contributors that are linked to an 
            issue that a maintainer has triaged, labeled `accepted` and 
            assigned to you. Please open an issue (or find an existing one) 
            and wait for it to be accepted and assigned to you, then link it 
            in the PR description (e.g. `Fixes #123`).
        run: |
          accepted=$(gh api graphql \
            -F owner="$OWNER" -F name="$NAME" -F pr="$PR" \
            -f query='
              query($owner: String!, $name: String!, $pr: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $pr) {
                    closingIssuesReferences(first: 10) {
                      nodes {
                        state
                        repository { nameWithOwner }
                        labels(first: 10) { nodes { name } }
                        assignees(first: 10) { nodes { login } }
                      }
                    }
                  }
                }
              }' \
            --jq '[.data.repository.pullRequest.closingIssuesReferences.nodes[]
                   | select(.state == "OPEN"
                            and .repository.nameWithOwner == env.GH_REPO
                            and any(.labels.nodes[]; .name == "accepted")
                            and any(.assignees.nodes[]; .login == env.AUTHOR))]
                  | length')

          if [ "$accepted" -gt 0 ]; then
            echo "Found $accepted linked accepted issue(s)."
            exit 0
          fi

          gh pr comment "$PR" --body "$BODY"
          #gh pr close "$PR"
